title = "Tapoda Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Deterministic audited-platform idempotency fixtures"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^probe-20260729-(?:001|unauthorized|idempotent|shared-key|private|crash-window|production)$''',
]
paths = [
  '''^tests/Feature/AuditedPlatformPathTest\.php$''',
]

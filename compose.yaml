name: tapoda-next

x-app-environment: &app-environment
  APP_NAME: Tapoda Next
  APP_ENV: local
  APP_DEBUG: "false"
  APP_URL: http://localhost:8080
  APP_LOCALE: th
  APP_FALLBACK_LOCALE: th
  APP_KEY: ${APP_KEY:?Run bin/bootstrap-env first}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-tapoda}
  DB_USERNAME: ${POSTGRES_USER:-tapoda}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Run bin/bootstrap-env first}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  HORIZON_PREFIX: tapoda_local_horizon
  PLATFORM_ACTOR_ADAPTER: laravel-auth
  PLATFORM_COMPLETION_ADAPTER: ${PLATFORM_COMPLETION_ADAPTER:-deterministic-fake}
  PEOPLE_IDENTIFIER_LOOKUP_KEY_VERSION: ${PEOPLE_IDENTIFIER_LOOKUP_KEY_VERSION:?Run bin/bootstrap-env first}
  PEOPLE_IDENTIFIER_LOOKUP_KEY: ${PEOPLE_IDENTIFIER_LOOKUP_KEY:?Run bin/bootstrap-env first}
  PEOPLE_IDENTIFIER_LOOKUP_PREVIOUS_VERSION: ${PEOPLE_IDENTIFIER_LOOKUP_PREVIOUS_VERSION:-}
  PEOPLE_IDENTIFIER_LOOKUP_PREVIOUS_KEY: ${PEOPLE_IDENTIFIER_LOOKUP_PREVIOUS_KEY:-}
  IDENTITY_ACCOUNT_LOOKUP_KEY_VERSION: ${IDENTITY_ACCOUNT_LOOKUP_KEY_VERSION:?Run bin/bootstrap-env first}
  IDENTITY_ACCOUNT_LOOKUP_KEY: ${IDENTITY_ACCOUNT_LOOKUP_KEY:?Run bin/bootstrap-env first}
  IDENTITY_ACCOUNT_LOOKUP_PREVIOUS_VERSION: ${IDENTITY_ACCOUNT_LOOKUP_PREVIOUS_VERSION:-}
  IDENTITY_ACCOUNT_LOOKUP_PREVIOUS_KEY: ${IDENTITY_ACCOUNT_LOOKUP_PREVIOUS_KEY:-}
  IDENTITY_RATE_LIMIT_KEY_VERSION: ${IDENTITY_RATE_LIMIT_KEY_VERSION:?Run bin/bootstrap-env first}
  IDENTITY_RATE_LIMIT_KEY: ${IDENTITY_RATE_LIMIT_KEY:?Run bin/bootstrap-env first}
  IDENTITY_VERIFICATION_ADAPTER: ${IDENTITY_VERIFICATION_ADAPTER:-deterministic-fake}
  IDENTITY_DETERMINISTIC_CODE: ${IDENTITY_DETERMINISTIC_CODE:?Run bin/bootstrap-env first}

x-restore-environment: &restore-environment
  <<: *app-environment
  APP_URL: http://localhost:18080
  DB_HOST: postgres-restore
  DB_DATABASE: tapoda_restore
  REDIS_HOST: redis-restore
  HORIZON_PREFIX: tapoda_restore_horizon

x-app: &app
  image: ${TAPODA_APP_IMAGE:?Build a reviewed artifact and export TAPODA_APP_IMAGE}
  pull_policy: never
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

x-restore-app: &restore-app
  <<: *app
  profiles: ["restore"]
  environment: *restore-environment
  depends_on:
    postgres-restore:
      condition: service_healthy
    redis-restore:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "8080:8080"

  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  migrate:
    <<: *app
    profiles: ["tools"]
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true

  test:
    build:
      context: .
      target: test
    profiles: ["tools"]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_DATABASE: ${POSTGRES_DB:-tapoda}
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PLATFORM_ACTOR_ADAPTER: test-header
      PLATFORM_COMPLETION_ADAPTER: deterministic-fake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  restore-web:
    <<: *restore-app
    ports:
      - "18080:8080"

  restore-worker:
    <<: *restore-app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      disable: true

  restore-scheduler:
    <<: *restore-app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  restore-migrate:
    <<: *restore-app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true

  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tapoda}
      POSTGRES_USER: ${POSTGRES_USER:-tapoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bin/bootstrap-env first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-restore:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    profiles: ["restore"]
    environment:
      POSTGRES_DB: tapoda_restore
      POSTGRES_USER: ${POSTGRES_USER:-tapoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bin/bootstrap-env first}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-restore:
    image: redis:8.4-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    profiles: ["restore"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
